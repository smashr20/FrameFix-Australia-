<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - FrameFix Australia</title>
    <link href="index.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #12c2e9;
            --secondary-color: #c471ed;
            --tertiary-color: #f64f59;
            --text-color: white;
            --font-family: 'Raleway', sans-serif;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            background-color: #101820;
            color: var(--text-color);
        }

        /* Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 15px 10%;
            position: fixed;
            width: 90%;
            z-index: 1000;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }

        .app-header a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 22px;
            font-weight: bold;
        }

        .app-header ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .app-header ul li a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 16px;
            transition: 0.3s ease;
        }

        .app-header ul li a:hover {
            color: var(--tertiary-color);
        }

        /* Contact Section */
        .contact-container {
            padding: 100px 10%;
            text-align: center;
            background: #181b23;
        }

        .contact-container h2 {
            font-size: 36px;
            margin-bottom: 30px;
            color: var(--primary-color);
        }

        .contact-form {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }

        .contact-form label {
            font-size: 16px;
            color: #333;
            margin-bottom: 6px;
            display: block;
        }

        .contact-form input[type=text],
        .contact-form select,
        .contact-form textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            background: #f2f2f2;
        }

        .contact-form input[type=submit] {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .contact-form input[type=submit]:hover {
            background-color: var(--tertiary-color);
        }

        .footer {
            background: var(--primary-color);
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        .footer p {
            margin: 0;
            font-size: 14px;
        }

        .back-to-top {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .back-to-top:hover {
            color: var(--tertiary-color);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .app-header {
                flex-direction: column;
                text-align: center;
            }

            .app-header ul {
                flex-direction: column;
                gap: 10px;
            }

            .contact-container {
                padding: 50px 10%;
            }

            .contact-form {
                padding: 20px;
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="app-header">
        <nav class="app-header-left">
            <a href="home.html">FrameFix Australia</a>
        </nav>
        <nav class="app-header-right">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact Section -->
    <section class="contact-container">
        <h2>Contact Us</h2>
        <div class="contact-form">
            <form action="/action_page.php" id="contactForm">
                <label for="fname"><b>First Name</b></label>
                <input type="text" id="fname" name="firstname" placeholder="Your first name..">

                <label for="lname"><b>Last Name</b></label>
                <input type="text" id="lname" name="lastname" placeholder="Your last name..">

                <label for="country"><b>Country</b></label>
                <select id="country" name="country">
                    <option value="australia">Australia</option>
                    <option value="canada">Canada</option>
                    <option value="usa">USA</option>
                </select>

                <label for="subject"><b>Subject</b></label>
                <textarea id="subject" name="subject" placeholder="Write something.." style="height:200px"></textarea>

                <input type="submit" value="Submit">
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© Copyright 2024 by Rahul Sharma. All rights reserved.</p>
        <a href="#app-header" class="back-to-top">Back to Top</a>
    </footer>

</body>

</html>
