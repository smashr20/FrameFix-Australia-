<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Videos - FrameFix Australia</title>
    <link href="index.css" rel="stylesheet">
    <link href="music.css" rel="stylesheet">
    <link href="portfolio_child.css" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header id="app-header" class="app-header">
        <nav class="app-header-left">
            <a href="home.html">FrameFix Australia</a>
        </nav>
        <nav id="portfolioSection" class="app-header-left">
            Music Videos
        </nav>
    </header>

    <!-- Music Section -->
    <div id="music" class="mediaBox sectionContainer">
        <div class="mediaBoxleft">
            <video src="video/trimmed.mp4" autoplay loop muted></video>
        </div>
        <div class="sectionFooterList mediaBoxRight">
            <div class="mediaboxHeader">
                All Music
            </div>
            <ul class="mediaList">
                <li>
                    <div class="innerFooterSection mediaLi">
                        <div><img src="floor plan.JPG" alt="image" class="iconImg" /></div>
                        <div class="innerFooterSectionInfo">blackbird - Alterbridge</div>
                    </div>
                </li>
                <li>
                    <div class="innerFooterSection mediaLi">
                        <div><img src="1ST render.JPG" alt="image" class="iconImg" /></div>
                        <div class="innerFooterSectionInfo">Don't cry -GnR</div>
                    </div>
                </li>
                <li>
                    <div class="innerFooterSection mediaLi">
                        <div><img src="chair_3_1.png" alt="image" class="iconImg" /></div>
                        <div class="innerFooterSectionInfo">Dream on - Aerosmith</div>
                    </div>
                </li>
            </ul>
            <!-- Pagination -->
            <div class="pagination">
                <span class="page-btn page-step" data-shown="1">&laquo;</span>
                <a href="#page-1" id="page-1" class="page-btn">1</a>
                <a href="#page-2" id="page-2" class="page-btn">2</a>
                <a href="#page-3" id="page-3" class="page-btn">3</a>
                <a href="#page-2" class="page-btn page-step" data-shown="1">&raquo;</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>© Copyright 2024 by Rahul Sharma. All rights reserved.</p>
        <a href="#app-header" class="back-to-top">Back to Top</a>
    </footer>

    <script src="index.js"></script>
</body>

</html>
